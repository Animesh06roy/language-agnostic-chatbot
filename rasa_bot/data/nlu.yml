# Rasa NLU Training Data
# Smart India Hackathon 2025 — Education FAQ Chatbot
# Each intent has multiple example phrases for robust training

version: "3.1"

nlu:

  # ── GREETINGS ──────────────────────────────────────────────────────────────
  - intent: greet
    examples: |
      - hello
      - hi
      - hey
      - good morning
      - good afternoon
      - good evening
      - namaste
      - thanks
      - thank you

  # ── ADMISSIONS ─────────────────────────────────────────────────────────────
  - intent: ask_admission_process
    examples: |
      - How do I apply for admission?
      - What is the admission process?
      - How to get enrolled in the college?
      - Tell me about the admission procedure
      - I want to take admission
      - How to enroll in the university?
      - What is the process for joining?
      - I want to apply for a seat
      - How do I get admitted?

  - intent: ask_admission_deadline
    examples: |
      - When is the admission deadline?
